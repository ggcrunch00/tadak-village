<title>타닥타닥 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: the island is the page. A few objects float over the world:
   village crest (top-left), resource strip (top-right), tool rail (left edge),
   and the typing dock (bottom center), which is the one heavy surface.
   One light UI look over a living day/night world, so no dark-mode split.
   Shape rule: surfaces 16px, tiles inside surfaces 10px, every control is a pill. */
:root{
  --sea:#5fb4d0;
  --paper:#f7f8fa;      /* floating surfaces */
  --paper-2:#eceff4;    /* wells inside surfaces */
  --ink:#1f2a37;        /* primary text */
  --ink-2:#526072;      /* secondary text */
  --ink-3:#8a95a6;      /* untyped letters, hints */
  --line:rgba(31,42,55,.10);
  --accent:#f2b21b;     /* the single accent: caret, active mode, primary action */
  --accent-ink:#3b2a00;
  --accent-soft:#fff3cf;
  --good:#2f9e62;
  --bad:#e5484d;
  --raid:#c4373c;
  --shadow:0 12px 32px rgba(14,48,66,.22),0 2px 6px rgba(14,48,66,.12);
  --r-surface:16px; --r-tile:10px; --r-pill:999px;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Bagel Fat One","IBM Plex Sans KR",system-ui,sans-serif;
  --f-type:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gxr:max(16px,env(safe-area-inset-right,0px));
  --gt:max(14px,env(safe-area-inset-top,0px)); --gb:max(14px,env(safe-area-inset-bottom,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;padding-left:var(--gx);padding-right:var(--gxr)}
.hud>*{pointer-events:auto}
body.titled .hud{opacity:0;visibility:hidden}
.hud{transition:opacity .4s}

/* controls */
.btn{appearance:none;border:0;cursor:pointer;border-radius:var(--r-pill);padding:9px 16px;font-weight:600;font-size:14px;line-height:1.2;
  background:var(--paper-2);color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:transform .08s ease,background .15s}
.btn:hover{background:#e2e6ec}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible,.tile:focus-visible,.rail button:focus-visible,.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#ffc22e}
.btn.danger{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm{padding:6px 12px;font-size:13px}
kbd{font-family:var(--f-type);font-size:11px;background:var(--paper-2);border-radius:5px;padding:1px 6px;color:var(--ink-2);box-shadow:inset 0 -1px 0 rgba(31,42,55,.15)}
.rc{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-type);font-weight:700;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.rc svg{width:16px;height:16px}
.rc.miss{color:var(--bad)}

/* crest */
.crest{position:absolute;left:var(--gx);top:var(--gt);display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:var(--r-surface);padding:10px 16px 10px 10px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.crest canvas{width:52px;height:52px;border-radius:var(--r-tile);background:#cfe9d0;flex:none}
.crest b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1;letter-spacing:.01em}
.crest .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.wx{display:inline-flex;align-items:center;gap:3px;margin-left:6px;color:var(--ink-3)}
.wx svg{width:12px;height:12px}
.fame{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.fame i{display:block;width:96px;height:4px;border-radius:2px;background:var(--paper-2);overflow:hidden}
.fame i b{display:block;height:100%;width:0;background:var(--good);border-radius:inherit;transition:width .6s cubic-bezier(.2,.9,.3,1.1)}
.folk{display:flex;gap:10px;padding-left:12px;margin-left:2px;border-left:1px solid var(--line)}
.folk span{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink-2);gap:1px}
.folk span strong{font-family:var(--f-type);font-size:16px;color:var(--ink)}

/* resources */
.res{position:absolute;right:var(--gxr);top:var(--gt);display:flex;gap:2px;background:var(--paper);border-radius:var(--r-pill);padding:6px 8px;box-shadow:var(--shadow)}
.res .r{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:var(--r-pill)}
.res .r svg{width:22px;height:22px;flex:none}
.res .r span{font-family:var(--f-type);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;min-width:2.2ch}
.res .r.bump{animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
.res .r.flash{background:#ffe1e2}
@keyframes bump{40%{transform:scale(1.16)}}

/* rail */
.rail{position:absolute;left:var(--gx);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;background:var(--paper);border-radius:var(--r-surface);padding:8px;box-shadow:var(--shadow)}
.rail button{appearance:none;border:0;background:transparent;cursor:pointer;width:64px;padding:8px 0 6px;border-radius:var(--r-tile);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-2);position:relative}
.rail button svg{width:22px;height:22px;color:var(--ink)}
.rail button:hover{background:var(--paper-2)}
.rail button.on{background:var(--accent);color:var(--accent-ink)}
.rail button.on svg{color:var(--accent-ink)}
.rail hr{border:0;height:1px;background:var(--line);margin:2px 6px}
.rail .badge{position:absolute;top:4px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center}

/* drawer */
.drawer{position:absolute;left:calc(var(--gx) + 92px);top:calc(var(--gt) + 86px);bottom:calc(var(--gb) + var(--dockH,180px) + 12px);width:min(360px,calc(100% - 140px));background:var(--paper);border-radius:var(--r-surface);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:6;animation:drawerIn .22s cubic-bezier(.2,.9,.3,1)}
@keyframes drawerIn{from{opacity:0;transform:translateX(-10px)}}
.drawer>header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px 18px}
.drawer h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.drawer .x{appearance:none;border:0;background:var(--paper-2);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.drawer .x svg{width:16px;height:16px}
.dbody{flex:1;overflow-y:auto;padding:4px 18px 20px;scrollbar-width:thin}
.dbody h3{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.dbody p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.55}
.detail{background:var(--paper-2);border-radius:var(--r-tile);padding:12px 14px;margin-top:4px;display:grid;gap:6px}
.detail b{font-size:16px}
.detail .adj{font-size:12.5px;color:var(--ink-2)}
.detail .adj strong{color:var(--good);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{appearance:none;border:0;background:transparent;cursor:pointer;border-radius:var(--r-tile);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;text-align:center}
.tile:hover{background:var(--paper-2)}
.tile.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tile canvas{width:84px;height:60px}
.tile .nm{font-size:13px;font-weight:600}
.szb{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-2);background:var(--paper-2);border-radius:6px;padding:1px 5px;margin-left:2px}
.tile .cost{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tile.poor canvas{opacity:.55}
.tile.locked{cursor:default}
.tile.locked canvas{filter:grayscale(1);opacity:.35}
.tile.locked .nm{color:var(--ink-3)}
.tile .need{font-size:11px;color:var(--ink-3);display:flex;gap:3px;align-items:center}
.tile .need svg{width:11px;height:11px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .ic{width:38px;height:38px;border-radius:var(--r-tile);background:var(--paper-2);display:grid;place-items:center;flex:none}
.row .ic svg{width:20px;height:20px}
.row.done .ic{background:#dff3e7;color:var(--good)}
.row.ready .ic{background:var(--accent);color:var(--accent-ink)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:14px}
.row .txt span{display:block;font-size:12px;color:var(--ink-2);line-height:1.45}
.row .txt .cost{margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.castle-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--paper-2);border-radius:var(--r-tile);padding:12px}
.castle-card canvas{width:96px;height:84px}
.castle-card b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.checks{list-style:none;margin:8px 0 10px;padding:0;display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}
.checks li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.checks svg{width:14px;height:14px;color:var(--ink-3)}
.checks .ok svg{color:var(--good)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--paper-2);border-radius:var(--r-tile);padding:10px 12px}
.stat small{display:block;font-size:11.5px;color:var(--ink-2)}
.stat b{font-family:var(--f-type);font-size:20px;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:11px;color:var(--ink-3);margin-left:3px}
.spark{background:var(--paper-2);border-radius:var(--r-tile);padding:10px 12px;margin-top:6px}
.spark svg{width:100%;height:auto;display:block}
.relics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.relic{border-radius:var(--r-tile);background:var(--paper-2);aspect-ratio:1;display:grid;place-items:center;color:var(--ink-3)}
.relic svg{width:24px;height:24px}
.relic.on{background:#2b3446;color:var(--accent)}
.dbar{display:block;height:4px;border-radius:2px;background:var(--paper-2);margin-top:5px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.heat svg{width:100%;height:auto;display:block}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:18px 6px}

/* dock */
.dock{position:absolute;left:50%;bottom:var(--gb);transform:translateX(-50%);width:min(780px,calc(100% - 32px));background:var(--paper);border-radius:var(--r-surface);box-shadow:var(--shadow);padding:12px 18px 12px;z-index:5}
.dock.shake{animation:shake .22s}
@keyframes shake{25%{transform:translateX(calc(-50% - 5px))}60%{transform:translateX(calc(-50% + 4px))}}
.dock.raid{box-shadow:0 0 0 3px var(--raid),var(--shadow)}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--paper-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;border-radius:var(--r-pill);padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,42,55,.15)}
.raidtag{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--raid)}
.raidtag svg{width:18px;height:18px}
.preview{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.tx{position:relative;margin:14px 0 10px;min-height:76px;font-family:var(--f-type);cursor:text}
.tx .head{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-2);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.tx .head b{color:var(--ink);font-weight:600}
.tx .prev{font-size:15px;line-height:1.5;color:var(--ink-3);margin-bottom:2px;white-space:pre-wrap}
.tx .next{font-size:15px;line-height:1.55;color:var(--ink-3);margin-top:6px;white-space:pre-wrap;overflow:hidden}
.tx .line{display:flex;align-items:baseline;gap:22px;overflow:hidden;white-space:nowrap}
.cur{position:relative;white-space:pre-wrap;font-size:26px;line-height:1.55;color:var(--ink-3);word-break:keep-all}
.wordy .cur{font-size:34px;white-space:pre}
body.big .cur{font-size:32px}
body.big .wordy .cur{font-size:44px}
body.big .tx .next,body.big .tx .prev{font-size:18px}
.up{font-size:21px;color:#b4bcc8;display:flex;gap:18px}
.up span:first-child{color:var(--ink-3)}
.ch{position:relative}
.ch.ok{color:var(--ink)}
.ch.bad{color:var(--bad)}
.ch.bad.sp{background:rgba(229,72,77,.18);border-radius:3px}
.ch.bad::after{content:attr(data-t);position:absolute;left:50%;top:-.55em;transform:translateX(-50%);font-size:.42em;color:var(--ink-3);line-height:1}
.ch.comp{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.ch.extra{color:var(--bad);opacity:.8}
.caret{position:absolute;left:0;top:0;width:3px;border-radius:2px;background:var(--accent);transition:transform .1s cubic-bezier(.25,.8,.3,1),height .1s;pointer-events:none}
.caret.idle{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ghost{position:absolute;left:0;top:0;width:3px;border-radius:2px;background:#7c8fd6;opacity:.4;pointer-events:none;transition:transform .2s linear}
.meaning{font-family:var(--f-ui);font-size:14px;color:var(--ink-2);margin-top:2px;min-height:1.3em}
.raidhint{font-family:var(--f-ui);font-size:13px;color:var(--ink-2);margin-top:4px}
.dbot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.nums{display:flex;gap:18px;align-items:baseline}
.nums span{display:flex;align-items:baseline;gap:5px}
.nums b{font-family:var(--f-type);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.nums .combo b{color:var(--accent-ink);background:var(--accent-soft);padding:0 6px;border-radius:6px}
.hint{display:flex;gap:6px;align-items:center}
#typer{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;background:transparent;color:transparent;caret-color:transparent;z-index:1}
.grade{position:absolute;right:18px;top:-18px;font-family:var(--f-display);font-size:22px;pointer-events:none;opacity:0;color:var(--ink);text-shadow:0 2px 0 #fff,0 0 12px rgba(255,255,255,.8)}
.grade.show{animation:gradepop .9s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes gradepop{0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1;transform:translateY(-6px) scale(1.1)}70%{opacity:1;transform:translateY(-10px)}100%{opacity:0;transform:translateY(-22px)}}

/* banner, coach */
.banner{position:absolute;left:50%;top:calc(var(--gt) + 4px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;font-size:13.5px;box-shadow:var(--shadow);z-index:7;max-width:calc(100% - 32px)}
.banner b{color:var(--accent)}
.banner .btn{background:rgba(255,255,255,.14);color:#fff}
.banner .btn.primary{background:var(--accent);color:var(--accent-ink)}
.banner .rc{color:#fff}
.coach{position:absolute;right:var(--gxr);top:calc(var(--gt) + 64px);width:300px;background:var(--paper);border-radius:var(--r-surface);box-shadow:var(--shadow);padding:16px 18px;font-size:13px;line-height:1.6;z-index:4}
.coach b.t{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;margin-bottom:6px}
.coach ol{margin:0;padding-left:18px;color:var(--ink-2)}
.coach .row2{display:flex;justify-content:flex-end;margin-top:10px}

/* object popover */
.pop{position:fixed;left:0;top:0;z-index:8;background:var(--paper);border-radius:var(--r-surface);box-shadow:var(--shadow);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px;min-width:200px;max-width:280px}
.pop .pt b{display:block;font-size:15px}
.pop .pt span{display:block;font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.pop .pb{display:flex;gap:6px;flex-wrap:wrap}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px}
.toast.act .btn{background:rgba(255,255,255,.16);color:#fff}
/* dungeon */
.dungeon{position:absolute;left:50%;bottom:calc(var(--gb) + var(--dockH,180px) + 12px);transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:#232a38;color:#eef1f6;border-radius:var(--r-surface);box-shadow:var(--shadow);padding:16px 18px;z-index:6}
.dungeon h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.dungeon p{margin:6px 0 0;color:#aeb7c7;font-size:13px}
.path{display:flex;align-items:center;gap:0;margin:14px 0 10px}
.path i{width:30px;height:30px;border-radius:50%;background:#353e50;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#8e99ad;flex:none}
.path i svg{width:16px;height:16px}
.path i.done{background:var(--good);color:#fff}
.path i.cur{background:var(--accent);color:var(--accent-ink)}
.path i.fail{background:var(--bad);color:#fff}
.path em{flex:1;height:2px;background:#353e50}
.timer{height:6px;border-radius:3px;background:#353e50;overflow:hidden;margin-top:8px}
.timer b{display:block;height:100%;background:var(--accent);transform-origin:left;width:100%}
.loot{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#aeb7c7;align-items:center}
.loot .rc{color:#fff}
.dungeon .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dungeon .btn{background:#353e50;color:#fff}
.dungeon .btn.primary{background:var(--accent);color:var(--accent-ink)}

/* overlays */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.fly{position:fixed;left:0;top:0;width:24px;height:24px;pointer-events:none;z-index:70;will-change:transform}
.fly svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(14,48,66,.35))}
.toasts{position:fixed;right:var(--gxr);bottom:calc(var(--gb) + 8px);display:flex;flex-direction:column;gap:8px;z-index:80;pointer-events:none;align-items:flex-end}
.toast{display:flex;gap:12px;align-items:center;max-width:min(320px,calc(100vw - 32px));padding:10px 14px 10px 10px;border-radius:var(--r-surface);background:var(--ink);color:#fff;box-shadow:var(--shadow);animation:toastIn .45s cubic-bezier(.2,1.2,.4,1) both;font-size:13px}
.toast.plain{padding:10px 16px}
.toast.out{animation:toastOut .4s ease forwards}
.toast .ic{width:42px;height:42px;border-radius:var(--r-tile);display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.toast .ic svg{width:24px;height:24px}
.toast small{font-size:11px;color:#b9c2d0;display:block}
.toast b{font-size:15px;display:block}
@keyframes toastIn{from{opacity:0;transform:translateY(24px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(16px)}}
.levelup{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:75;text-align:center;pointer-events:none;width:min(90vw,640px)}
.levelup small{display:block;font-weight:700;font-size:15px;color:#fff;text-shadow:0 2px 8px rgba(14,48,66,.6)}

function scalePaths(list){ const pts=(list||[]).map(p=>p.split(',').map(Number)), out=new Set(pts.map(([x,y])=>`${gsc(x)},${gsc(y)}`));
 for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){ const [ax,ay]=pts[i],[bx,by]=pts[j]; if(Math.max(Math.abs(ax-bx),Math.abs(ay-by))!==1) continue;
  const x0=gsc(ax),y0=gsc(ay),x1=gsc(bx),y1=gsc(by), n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0)); for(let k=1;k<n;k++) out.add(`${Math.round(x0+(x1-x0)*k/n)},${Math.round(y0+(y1-y0)*k/n)}`); }
 return [...out]; }
function scaleMap(d){ const o={...d}, L0=d.land; o.land=(x,y)=>L0(ginv(x),ginv(y)); if(d.sand){ const S0=d.sand; o.sand=(x,y)=>S0(ginv(x),ginv(y)); }
 o.center=d.center.map(gsf); o.castle=d.castle.map(gsc); if(d.cave) o.cave=d.cave.map(gsc); if(d.tower) o.tower=d.tower.map(gsc);
 if(d.camps) o.camps=d.camps.map(c=>c.map(gsc)); ['ruins','stones','prebuilt'].forEach(k=>{ if(d[k]) o[k]=d[k].map(u=>({...u,x:gsc(u.x),y:gsc(u.y)})); });
 if(d.regions) o.regions=d.regions.map(r=>({...r,c:r.c.map(gsf),r:r.r*GK})); o.paths=scalePaths(d.paths); o.trees=Math.round((d.trees??15)*GK*GK); return o; }

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG_PREFIX={9:8,10:8,11:8,14:13,15:13,16:13,19:18};
const JONG_PREFIX={3:1,5:4,6:4,9:8,10:8,11:8,12:8,13:8,14:8,15:8,18:17};
const isSyl=c=>{ const k=c.charCodeAt(0); return k>=0xAC00&&k<=0xD7A3; };
const dec=c=>{ const i=c.charCodeAt(0)-0xAC00; return {cho:Math.floor(i/588),jung:Math.floor((i%588)/28),jong:i%28}; };
function strokes(c){ if(!isSyl(c)) return 1; const d=dec(c); return 1+(JUNG_PREFIX[d.jung]!==undefined?2:1)+(d.jong===0?0:(JONG_PREFIX[d.jong]!==undefined?2:1)); }
function strokesOf(s){ return [...s].reduce((a,c)=>a+strokes(c),0); }
function composeOK(p,t){
 if(p===t) return true; if(!t||!isSyl(t)) return false; const td=dec(t);
 if(!isSyl(p)) return CHO.indexOf(p)===td.cho;
 const pd=dec(p); if(pd.cho!==td.cho) return false;
 if(pd.jung!==td.jung) return JUNG_PREFIX[td.jung]===pd.jung&&pd.jong===0;
 if(pd.jong===0||pd.jong===td.jong||JONG_PREFIX[td.jong]===pd.jong) return true;
 return td.jong===0||JONG_PREFIX[pd.jong]===td.jong;
}

function updateBadges(){ ensureDaily(); const open=(isCamp()?[]:QUESTS).filter(q=>!S.claimed.includes(q.id)).slice(0,3), ready=open.filter(q=>q.prog()>=q.goal).length+P.daily.goals.filter(d=>!d.claimed&&dailyProg(d)>=d.n).length+(S.reqs||[]).filter(r=>reqProg(r)>=r.n).length, qb=$('qBadge'); if(qb){ qb.hidden=!ready; qb.textContent=ready; }
 const canR=TECHS.filter(t=>S.castle>=t.era&&!hasTech(t.id)&&canPay(t.cost)).length, nx=CASTLE[S.castle+1], canUp=nx&&S.castle<MAP.maxCastle&&canPay(nx.cost)&&TECHS.filter(t=>t.era===S.castle&&hasTech(t.id)).length>=nx.techs, rb=$('rBadge'); if(rb){ const n=canR+(canUp?1:0); rb.hidden=!n; rb.textContent=n; } }
function afterProgress(){ dirty(); updateCrest(); renderNums(); updateBadges(); checkObjectives(); if(drawerTab&&drawerTab!=='build') renderDrawer();
 ACHS.forEach(a=>{ if(!P.achs.includes(a.id)&&a.ok()){ P.achs.push(a.id); achToast(a); } }); save(); }

/* ================================================================
   CAMPAIGN ENGINE: features, story dialogue, objectives, duel
   ================================================================ */
function featureOn(f){ const v=MAP&&MAP[f]; if(v==='castle2') return S.castle>=2; if(f==='expedition') return !!v&&S.objs.some(o=>o.t==='cave'); return !!v; }
const isCamp=()=>!!(MAP&&MAP.campaign);
const chapterOf=id=>CAMPAIGN.find(c=>c.id===id);
const curChapter=()=>isCamp()?chapterOf(S.map):null;

// ---------- dialogue ----------
let story=null; // {lines,i,shown,full,typing,done,timer}
const storyOn=()=>!!story;
function busy(){ return !!(raid||(dun&&dun.phase==='room')||duel||(T.special&&T.special!=='story')); }
function whenFree(fn){ if(!busy()&&$('modal2').hidden){ fn(); return; } setTimeout(()=>whenFree(fn),900); }
function playScript(lines,done){ if(!lines||!lines.length){ done&&done(); return; } if(story){ const prev=story.done; story.lines=story.lines.concat(lines); story.done=()=>{ prev&&prev(); done&&done(); }; return; }
 story={lines:lines.slice(),i:-1,done}; closePop(); cancelPlace(true); $('story').hidden=false; document.body.classList.add('storying'); nextLine(); }
function portraitHTML(w){ const c=CHAR[w]; if(!c||!c.spr||typeof SPRITE_DATA==='undefined'||!SPRITE_DATA[c.spr]) return ''; return `<img src="${SPRITE_DATA[c.spr].d}" alt="${c.name}">`; }
function nextLine(){ const st=story; st.i++; if(st.i>=st.lines.length){ endStory(); return; } const ln=st.lines[st.i], c=CHAR[ln.w]||CHAR.narr;
 const el=$('story'); el.className='story'+(ln.w==='narr'?' narr':'')+(ln.w==='mueum'?' mueum':''); el.querySelector('.sp').innerHTML=portraitHTML(ln.w);
 el.querySelector('.who').innerHTML=c.name?`<b>${c.name}</b><span>${c.role}</span>`:''; st.full=ln.t; st.shown=0; st.typing=!!ln.type; clearInterval(st.timer);
 const tx=el.querySelector('.say'); tx.textContent=''; st.timer=setInterval(()=>{ st.shown=Math.min(st.full.length,st.shown+2); tx.textContent=st.full.slice(0,st.shown); if(st.shown>=st.full.length){ clearInterval(st.timer); afterReveal(); } },22);
 el.querySelector('.hint').innerHTML=''; AU.tone(ln.w==='mueum'?220:660,'sine',0.03,0.05); }
function afterReveal(){ const st=story, ln=st.lines[st.i];
 if(ln.type){ $('story').querySelector('.hint').innerHTML=`아래에 그대로 쓰고 <kbd>Space</kbd>`; askType(ln.type,'story',ok=>{ if(!story) return; nextLine(); }); }
 else $('story').querySelector('.hint').innerHTML=`<kbd>Enter</kbd> 다음`; }
function advanceStory(){ const st=story; if(!st) return; if(st.shown<st.full.length){ clearInterval(st.timer); st.shown=st.full.length; $('story').querySelector('.say').textContent=st.full; afterReveal(); return; } if(st.typing) return; nextLine(); }
function endStory(){ const d=story&&story.done; clearInterval(story&&story.timer); story=null; $('story').hidden=true; document.body.classList.remove('storying'); if(T.special==='story'){ T.special=null; setMode(T.prevMode||'word',true); T.prevMode=null; } refocus(); d&&d(); }

// ---------- typed prompts (story, restore ruins, wake stones) ----------
let askCb=null;
function askType(text,kind,cb){ askCb=cb; T.prevMode=T.prevMode||T.mode; T.special=kind; T.target=text; resetInput(); renderDockTop(); $('hint').innerHTML='<kbd>Space</kbd> 또는 <kbd>Enter</kbd> 완성';
 const label=kind==='restore'?'무너진 집의 이름을 다시 써요':kind==='stone'?'비석에 새겨진 문장':kind==='duel'?'무음에게 답하기':'이야기 속 문장';
 txBody.className=''; txBody.innerHTML=`<div class="head"><span><b>${label}</b></span><span>정확도 80% 이상이면 통과</span></div><div class="cur" id="cur"></div>`; buildSpans($('cur')); renderTyped(); renderNums(); refocus(); }
function promptSubmit(acc,perfect){ const kind=T.special, cb=askCb;
 if(kind==='duel'){ duelAnswer(acc,perfect); return; }
 if(acc<0.8){ errorFx(); showGrade('다시 한 번'); resetInput(); renderTyped(); return; }
 showGrade(perfect?'PERFECT':'좋아요'); AU.pluck(5); burstAt(caretPoint(),perfect); askCb=null;
 if(kind!=='story'){ T.special=null; setMode(T.prevMode||'word',true); T.prevMode=null; } else { resetInput(); }
 cb&&cb(true); }
function cancelAsk(){ if(T.special==='duel'){ duel=null; $('duel').hidden=true; } askCb=null; T.special=null; setMode(T.prevMode||'word',true); T.prevMode=null; }
function restoreRuin(o){ closePop(); askType(o.word,'restore',()=>{ const i=S.objs.indexOf(o); if(i<0) return; S.objs.splice(i,1,{t:o.becomes,gx:o.gx,gy:o.gy,sz:1,seed:o.seed,born:performance.now()}); S.stats.restored=(S.stats.restored||0)+1; dirty(); puff(o.gx,o.gy,20); sparkle(o.gx,o.gy,16); AU.build(); setTimeout(()=>AU.chime(),200); floatText(o.gx,o.gy,'복원!','#ffe08a'); syncFolk(); afterProgress(); }); }
function wakeStone(o){ closePop(); askType(o.word,'stone',()=>{ o.awake=true; sparkle(o.gx,o.gy,20); AU.fanfare(); floatText(o.gx,o.gy,'비석이 깨어났다','#ffe08a'); afterProgress(); }); }

// ---------- objectives ----------
function chPhase(ch){ return ch.goals.some(g=>!g.ph&&!S.camp.done[g.id])?1:2; }
function checkObjectives(){ const ch=curChapter(); if(!ch||!S.camp||S.camp.won) return; let newly=[]; const ph=chPhase(ch);
 ch.goals.forEach(gl=>{ if(S.camp.done[gl.id]||(gl.ph||1)>ph) return; if(gl.prog()>=gl.goal){ S.camp.done[gl.id]=true; newly.push(gl); } });
 newly.forEach(gl=>{ toastGoal(gl.text); if(ch.on&&ch.on[gl.id]) setTimeout(()=>whenFree(()=>playScript(ch.on[gl.id])),600); });
 renderObjTrack();
 if(ph===1&&chPhase(ch)===2&&!S.camp.mid&&ch.goals.some(g=>g.ph===2)){ S.camp.mid=true; setTimeout(()=>whenFree(()=>{ levelBanner(`${ch.no}장 2부`,ch.title,'새 목표가 생겼어요'); AU.fanfare(); setTimeout(()=>whenFree(()=>playScript(ch.mid||[],()=>{ renderObjTrack(); checkObjectives(); })),1800); }),newly.length?1600:300); return; }
 if(ch.goals.every(gl=>S.camp.done[gl.id])&&!S.camp.won){ S.camp.won=true; setTimeout(()=>whenFree(()=>finishChapter(ch)),newly.length?1800:300); } }
function toastGoal(t){ const el=document.createElement('div'); el.className='toast'; el.innerHTML=`<div class="ic">${PH.check}</div><div><small>목표 완료</small><b>${t}</b></div>`; $('toasts').appendChild(el); AU.chime(); setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),450); },3500); }
function renderObjTrack(){ const el=$('objTrack'), ch=curChapter(); if(!ch||!started){ el.hidden=true; return; } el.hidden=false; if(S.camp.fold===undefined) S.camp.fold=innerWidth<760;
 el.innerHTML=`<div class="oh"><b>${ch.no}장 ${ch.title}</b><button class="x" id="objFold" aria-label="접기">${S.camp.fold?PH.plus:PH.minus}</button></div>`+(S.camp.fold?'':(chPhase(ch)===2&&ch.goals.some(g=>g.ph===2)?`<div class="og done"><i>${PH.check}</i><span>1부 목표 모두 완료</span><em></em></div><div class="oph">2부</div>`:'')+ch.goals.filter(gl=>(gl.ph||1)===(ch.goals.some(g=>g.ph===2)?chPhase(ch):1)).map(gl=>{ const v=Math.min(gl.goal,gl.prog()), d=S.camp.done[gl.id]; return `<div class="og ${d?'done':''}"><i>${d?PH.check:''}</i><span>${gl.text}</span><em>${gl.goal>1?`${v}/${gl.goal}`:''}</em></div>`; }).join(''));
 $('objFold').onclick=()=>{ S.camp.fold=!S.camp.fold; renderObjTrack(); refocus(); }; }
function chapterStars(ch){ const acc=S.camp.accN?S.camp.accSum/S.camp.accN:1; return 1+(acc>=0.9?1:0)+(ch.star3.ok()?1:0); }
function finishChapter(ch){ const stars=chapterStars(ch), acc=S.camp.accN?Math.round(100*S.camp.accSum/S.camp.accN):100;
 const prev=(P.camp.done[ch.id]||{}).stars||0; P.camp.done[ch.id]={stars:Math.max(prev,stars)}; saveProfile(); save();
 playScript(ch.outro,()=>{ AU.fanfare(); confetti(160);
  const next=CAMPAIGN[CAMPAIGN.indexOf(ch)+1];
  showModal(`<div class="vic"><small>${ch.no}장 완료</small><b>${ch.title}</b><div class="stars">${[1,2,3].map(i=>`<i class="${i<=stars?'on':''}">${PH.star}</i>`).join('')}</div>
   <ul class="checks"><li class="ok">${PH.check}목표 모두 달성</li><li class="${acc>=90?'ok':''}">${PH.check}평균 정확도 90% 이상 (지금 ${acc}%)</li><li class="${ch.star3.ok()?'ok':''}">${PH.check}${ch.star3.text}</li></ul>
   <p class="mnote" style="text-align:center"><button class="linkbtn" data-m="fb">이 장 소감 남기기</button></p><div class="foot"><button class="btn" data-m="stay">이 섬 계속 꾸미기</button><button class="btn primary" data-m="map">${next?`다음 장: ${next.title}`:'캠페인 지도'}</button></div></div>`,
   k=>{ if(k==='map') openCampaign(next?next.id:null); if(k==='fb') setTimeout(openFeedback,50); });
  if(ch.id==='ch6'&&!P.endingSeen){ P.endingSeen=true; saveProfile(); }
 }); }

// ---------- final duel ----------
let duel=null;
function startDuel(){ const ch=curChapter(); if(!ch) return; if(S.objs.filter(o=>o.t==='wordstone'&&!o.awake).length){ toast('비석 세 개를 먼저 깨워야 탑의 문이 열려요'); return; }
 if(S.camp.duelWon){ toast('무음은 이제 말과 말 사이에 머물고 있어요'); return; }
 closePop(); closeDrawer(); duel={i:0,hp:DUEL.length,limit:0,left:0}; AU.horn(); $('duel').hidden=false; duelStep(); }
function duelStep(){ const d=DUEL[duel.i]; duel.limit=(6+strokesOf(d.a)*0.62); duel.left=duel.limit+1.2; renderDuel(); askType(d.a,'duel',null); }
function renderDuel(){ const el=$('duel'); if(!duel){ el.hidden=true; return; } const d=DUEL[Math.min(duel.i,DUEL.length-1)];
 el.innerHTML=`<div class="dp">${portraitHTML('mueum')}</div><div class="dt"><small>침묵왕 무음</small><p>${d.m}</p><div class="hp">${DUEL.map((_,i)=>`<i class="${i<duel.i?'gone':''}"></i>`).join('')}</div><div class="timer"><b id="duelTimer"></b></div></div>`; }
function stepDuel(dt){ if(!duel||T.special!=='duel') return; duel.left-=dt/1000; const b=$('duelTimer'); if(b){ b.style.transform=`scaleX(${Math.max(0,Math.min(1,duel.left/duel.limit))})`; b.style.background=duel.left<duel.limit*.25?'var(--bad)':''; }
 if(duel.left<=0){ S.camp.duelFails++; errorFx(); showGrade('안개가 짙어졌다'); toast('시간이 다 됐어요. 같은 문장을 다시 써 봐요'); duel.left=duel.limit+2; resetInput(); renderTyped(); } }
function duelAnswer(acc,perfect){ if(acc<0.8){ errorFx(); showGrade('다시 한 번'); resetInput(); renderTyped(); return; }
 AU.zap(); AU.pluck(duel.i+3); showGrade(perfect?'PERFECT':'닿았다'); burstAt(caretPoint(),true); shake(6); duel.i++;
 if(duel.i>=DUEL.length){ duel=null; $('duel').hidden=true; T.special=null; askCb=null; setMode(T.prevMode||'word',true); T.prevMode=null; S.camp.duelWon=true; S.objs.forEach(o=>{ if(o.t==='tower') o.calm=true; }); afterProgress(); return; }
 duelStep(); }

function profileSummary(pr,sl){ const days=pr.days||{}; let play=0,typeMs=0,strokes=0,n=0,accSum=0,cnt={word:0,sentence:0,long:0,eng:0}; const dk=Object.keys(days).sort();
 dk.forEach(k=>{ const d=days[k]; play+=d.play||0; typeMs+=d.typeMs||0; strokes+=d.strokes||0; n+=d.n||0; accSum+=d.accSum||0; for(const m in cnt) cnt[m]+=d[m]||0; });
 const done=(pr.camp&&pr.camp.done)||{}, chs=CAMPAIGN.filter(c=>done[c.id]), stars=chs.reduce((a,c)=>a+(done[c.id].stars||0),0);

  best:Math.max(0,...Object.values(pr.best||{0:0})),weak:errs.join(' '),fun:fb?fb.fun:'',feel:fb?fb.feel:'',likes:fb?fb.likes.join(' '):'',note:fb?fb.note:'',fbCount:(pr.fb||[]).length}; }
function recordOf(sl){ let pr; try{ pr=JSON.parse(LS.get(`tadak@${sl.id}/profile`)||'null'); }catch(e){} pr=pr||P_DEFAULT(); return {app:'tadak-village',v:1,at:new Date().toISOString(),slot:{num:sl.num,name:sl.name},sum:profileSummary(pr,sl),days:pr.days||{},fb:pr.fb||[],camp:(pr.camp&&pr.camp.done)||{}}; }
const encRec=r=>'TADAK1:'+btoa(unescape(encodeURIComponent(JSON.stringify(r))));
function decRec(t){ t=t.trim(); if(t.startsWith('TADAK1:')) t=decodeURIComponent(escape(atob(t.slice(7)))); const r=JSON.parse(t); if(r.app!=='tadak-village') throw 0; return r; }
