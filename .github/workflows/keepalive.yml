name: Keep class server awake

# Supabase 무료 프로젝트는 일주일쯤 조용하면 일시 정지돼요. 3일마다 가벼운 요청을 보내요.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase (only when server.json exists)
        run: |
          if [ ! -f server.json ]; then echo "server.json 없음, 건너뜀"; exit 0; fi
          URL=$(python3 -c "import json;print(json.load(open('server.json'))['url'].rstrip('/'))")
          KEY=$(python3 -c "import json;print(json.load(open('server.json'))['key'])")
          curl -sS -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/cl_classes?select=id&limit=1" -H "apikey: $KEY"
